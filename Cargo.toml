[package]
name = "sootmark-audit"
version = "0.1.1"
edition = "2021"
rust-version = "1.80"
description = "Linux audit logs (auditd's audit.log, raw or enriched): records gathered into events, values decoded, command lines, system calls and socket addresses, and the logins, sudo commands, account changes and connections they record."
license = "MIT OR Apache-2.0"
repository = "https://github.com/Sootmark/audit"
homepage = "https://sootmark.com"
keywords = ["forensics", "dfir", "incident-response", "linux", "auditd"]
# Sources only: test fixtures stay in the repository.
include = ["/src", "/README.md", "/LICENSE-APACHE", "/LICENSE-MIT"]

[lib]
name = "audit"

[dependencies]
common = { package = "sootmark-common", version = "0.3.6" }

[dev-dependencies]
proptest = "1"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_possible_wrap = "allow"
cast_precision_loss = "allow"
